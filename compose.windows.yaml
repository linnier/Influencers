name: influencers-lan
services:
  app:
    image: influencers-app:lan
    build:
      context: .
      args:
        NPM_OFFLINE: ${NPM_OFFLINE:-false}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      INFLUENCERS_DB_PATH: /app/data/influencers.sqlite
    volumes:
      - app_data:/app/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAN_IP: ${LAN_IP:?Run the Windows setup first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Configure the administrator username}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configure the password hash}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official Caddy binary carries this file capability, even on 8443.
    cap_add:
      - NET_BIND_SERVICE
volumes:
  app_data:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: true
  public:
