<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>itea · 达人合作报名 / Creator collaboration application</title><style>body{font:15px/1.6 system-ui,sans-serif;color:#244039;background:#f4f7f5;margin:0}main{max-width:760px;margin:36px auto;padding:28px;background:white;border:1px solid #d5e1da;border-radius:14px}h1{font-size:24px}label{display:block;margin:12px 0}input,select,textarea,button{box-sizing:border-box;font:inherit;padding:10px;border:1px solid #cadbd1;border-radius:7px;width:100%;color:inherit;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.notice{padding:16px;background:#eaf3ee;border-radius:9px}button{width:auto;cursor:pointer}button.primary{background:#205c49;color:white;margin-top:16px}button:disabled{opacity:.55;cursor:wait}input[type=checkbox]{width:auto}small{color:#6c8378}.account{padding:14px 0;border-bottom:1px solid #dae5df}#status{white-space:pre-wrap;color:#aa3e24}a{color:#205c49}@media(max-width:600px){main{margin:12px;padding:18px}.grid{grid-template-columns:1fr}}</style><main><h1>itea · 达人合作报名 / Creator collaboration application</h1><div class="notice" id="offer">正在读取邀约 / Loading invitation…</div><form id="application" hidden><div class="grid"><label>达人名称 / Creator name<input name="name" required maxlength="60"></label><label>邮箱 / Email address<input name="email" type="email" required maxlength="254"></label><label>itea账号（领券账号） / itea account<input name="itea" maxlength="120"><small>用于领取合作优惠券。 / Used to receive collaboration vouchers.</small></label><label>联系方式 / Contact details (WhatsApp / WeChat)<input name="contact" maxlength="300" placeholder="WhatsApp +65… 或微信号 / WeChat ID"></label><label>地区 / Country or region<input name="region" maxlength="60"></label><label>备注 / Notes<textarea name="notes" maxlength="2000" placeholder="合作时间或其他说明 / Availability or other details"></textarea></label></div><h3>平台账号 / Social media accounts</h3><div id="accounts"></div><button type="button" id="addAccount">＋ 添加其他平台账号 / Add another account</button><p><label><input type="checkbox" name="consent" required> 我已核对资料，同意将报名资料用于本次合作联系和审核。 / I confirm that my details are correct and agree to their use for contacting me and reviewing this collaboration application.</label></p><button class="primary" id="submit">提交报名 / Submit application</button><p><small>提交后由项目负责人审核确认；报名不代表合作已确认。 / Applications are subject to review by the project team. Submitting this form does not confirm a collaboration.</small></p></form><p id="status" role="status" aria-live="polite"></p></main><script src="/apply.js"></script></html>
