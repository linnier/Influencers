<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · itea 达人管理</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#203e35;background:#f5f7f4;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}a{color:inherit}.shell{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.intro{background:#174c3b;color:#f6f9f3;padding:48px clamp(32px,5.7vw,92px);display:flex;flex-direction:column;position:relative;overflow:hidden}.brand{display:flex;gap:13px;align-items:center;font-weight:650;letter-spacing:.03em}.mark{display:grid;place-items:center;border:1px solid #ffffff60;border-radius:13px;width:48px;height:48px;font-size:22px;font-weight:750}.brand small{display:block;font-size:11px;font-weight:400;color:#b9cfc2;letter-spacing:.11em}.intro-main{margin:auto 0;padding:70px 0}.eyebrow{font-size:12px;letter-spacing:.15em;color:#c8d9ac}.intro h1{font-size:clamp(36px,4vw,58px);font-weight:600;letter-spacing:-.04em;line-height:1.25;margin:22px 0}.intro-main>p{color:#c6d8cc;max-width:350px;font-size:16px}.steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}.steps span{border:1px solid #ffffff38;border-radius:30px;padding:7px 14px;color:#dce9df;font-size:12px}.intro-footer{border-top:1px solid #ffffff26;padding-top:22px;color:#bdd1c2;font-size:12px}.form-side{display:flex;align-items:center;justify-content:center;padding:48px 30px}.card{width:100%;max-width:390px}.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#55705f;background:#e8efe6;border-radius:20px;padding:5px 11px}.dot{width:6px;height:6px;border-radius:50%;background:#598167}h2{font-size:30px;letter-spacing:-.03em;font-weight:650;margin:20px 0 6px}.subtitle{color:#758178;margin:0 0 30px;font-size:14px}label{display:block;font-size:13px;font-weight:550;margin:19px 0 8px}input{width:100%;border:1px solid #cbd6ce;border-radius:9px;padding:13px 14px;background:#fff;color:#203e35;outline:none}input:focus{border-color:#2c6e54;box-shadow:0 0 0 3px #2c6e5418}button:focus-visible,a:focus-visible{outline:3px solid #92b8e1;outline-offset:3px}.password{position:relative}.password input{padding-right:66px}.toggle{position:absolute;right:7px;top:7px;padding:7px 9px;background:transparent;border:0;border-radius:5px;color:#64766a;font-size:12px;cursor:pointer}.error{color:#a53e32;font-size:13px;min-height:22px;margin:12px 0}.error:empty{visibility:hidden}.submit{border:0;border-radius:9px;padding:13px 16px;background:#205c46;color:#fff;width:100%;font-weight:600;cursor:pointer}.submit:hover{background:#174a38}.submit:disabled{opacity:.65;cursor:wait}.help{color:#829085;font-size:12px;text-align:center;margin:20px 0 0}.help strong{font-weight:550;color:#55705f}.footer{margin-top:40px;font-size:11px;letter-spacing:.1em;color:#97a297;text-align:center}@media(max-width:760px){.shell{grid-template-columns:1fr}.intro{padding:24px}.intro-main{padding:28px 0 0}.intro h1{font-size:30px;margin:12px 0}.intro-main>p,.intro-footer,.steps,.eyebrow{display:none}.brand small{font-size:10px}.mark{width:38px;height:38px;font-size:18px}.form-side{padding:35px 24px 45px;align-items:start}.subtitle{margin-bottom:24px}.footer{margin-top:28px}}
</style></head>
<body><main class="shell"><section class="intro" aria-label="itea 达人管理"><div class="brand"><span class="mark" aria-hidden="true">i</span><div>itea<small>CREATOR MANAGEMENT</small></div></div><div class="intro-main"><div class="eyebrow">MARKETING WORKSPACE</div><h1>达人、项目、内容<br>在这里一起管理。</h1><p>管理合作进度，记录内容数据，查看每位达人的合作效果。</p><div class="steps"><span>小红书</span><span>Instagram</span><span>TikTok</span></div></div><div class="intro-footer">itea · 市场部工作空间</div></section><section class="form-side"><div class="card"><span class="tag"><span class="dot" aria-hidden="true"></span>团队工作空间</span><h2>欢迎登录</h2><p class="subtitle">登录后进入达人合作管理</p><form id="loginForm" action="/auth/login" method="post"><label for="username">账号</label><input id="username" name="username" autocomplete="username" value="team" required maxlength="120" autocapitalize="none" spellcheck="false"><label for="password">密码</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required maxlength="1000"><button id="togglePassword" class="toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div><p class="error" id="loginError" role="alert" aria-live="polite"></p><button class="submit" id="loginButton" type="submit">登录工作空间 <span aria-hidden="true">→</span></button></form><p class="help">忘记密码？请联系<strong>网站管理员</strong></p><div class="footer">ITEA CREATOR HUB</div></div></section></main><script src="/login.js" defer></script></body></html>
