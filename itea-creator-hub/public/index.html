function newId(prefix){const b=new Uint8Array(16);crypto.getRandomValues(b);return prefix+Array.from(b,x=>(x+256).toString(16).slice(1)).join(String());}

function complete(p){return Number.isFinite(p.views)&&FeeOverview.interactionValue(p)!==null}

 const cs=filtered(),ps=posts.filter(p=>cs.some(c=>c.id===p.collab)),active=cs.filter(c=>!end.includes(c.stage)),pub=ps.length,completePosts=ps.filter(complete),v=completePosts.reduce((s,p)=>s+p.views,0),it=completePosts.reduce((s,p)=>s+interaction(p),0);

 ProjectWorkflow.mount();
