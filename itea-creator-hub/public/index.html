 if(projectTabs.includes(tab))html='<div class="subnav" role="group" aria-label="项目管理功能">'+projectTabs.map(x=>'<button data-tab="'+x+'" class="'+(tab===x?'active':'')+'">'+(x==='项目管理'?'项目列表':x==='报名与Post录入'?'项目报名':x)+'</button>').join('')+'</div>'+html;
 if(tab==='达人库')html=html.replace('<div class="tablewrap">','<div class="tablewrap creator-table">');
 if(tab==='达人手动入库')html=LifecycleUI.entryHTML(html);
 $('main').innerHTML=html;
 LifecycleUI.mount();
 if(tab==='批量导入')BulkUI.mount();
 if(tab==='达人手动入库')CreatorImport.mount();
 if($('prevCreators'))$('prevCreators').onclick=()=>{creatorPage=Math.max(0,creatorPage-1);render()};if($('nextCreators'))$('nextCreators').onclick=()=>{creatorPage++;render()};
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(busy)return;tab=b.dataset.tab;notify('');render()});
 document.querySelectorAll('[data-stage]').forEach(s=>s.onchange=()=>{if(busy){render();return}const c=co(s.dataset.stage),stage=s.value;const count=posts.filter(p=>p.collab===c.id).length;if(stage==='已完成'&&count<c.target){notify('发布数量尚未达到约定数，请先补录 Post。');render();return}if(pre.includes(stage)&&(c.confirmed||c.confirmedUnknown)){notify('已确认合作不可直接退回报名阶段；取消请选已取消。');render();return}if(['已确认合作','执行中','已完成'].includes(stage)&&!(c.confirmed||c.confirmedUnknown))c.confirmed=TODAY;c.stage=stage;commit('合作阶段已保存，统计已更新。')});
 document.querySelectorAll('[data-metric]').forEach(x=>x.onchange=()=>{if(busy){render();return}const p=posts.find(p=>p.id===x.dataset.post),n=x.value===''?null:Number(x.value);if(n!==null&&(!Number.isSafeInteger(n)||n<0)){notify('指标需要非负整数或留空。');render();return}p[x.dataset.metric]=n;p.updated=TODAY;commit('Post 数据已更新。')});
 document.querySelectorAll('[data-due]').forEach(x=>x.onchange=()=>{if(busy){render();return}co(x.dataset.due).due=x.value;commit('跟进日期已保存。')});
 if($('projectForm'))$('projectForm').onsubmit=e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target),name=f.get('name').trim(),owner=f.get('owner').trim();if(!name||!owner){notify('请填写项目名称和负责人。');return;}const budget=f.get('budget')===''?null:Number(f.get('budget'));projects.push({id:newId('P'),name,owner,budget,currency:f.get('currency')||'CNY'});ProjectWorkflow.created(projects[projects.length-1].id);commit('项目已创建，请添加参与达人。')};
 if($('creatorForm')){const form=$('creatorForm');const infer=()=>{const p=form.elements.platform.value,u=form.elements.url.value;if(!form.elements.handle.value){const h=CreatorImport.profileAccount(u,p);if(h)form.elements.handle.value=h;}};form.elements.url.onchange=infer;form.elements.platform.onchange=infer;form.onsubmit=e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target),pl=f.get('platform'),h=CreatorImport.handle(f.get('handle'),pl);if(accounts.some(a=>a.platform===pl&&CreatorImport.handle(a.handle,pl)===h)){notify('该平台账号已存在，请在达人库查询。');return}const url=f.get('url').trim();if(url&&!safeURL(url)){notify('主页链接无效。');return}const inferred=CreatorImport.profileAccount(url,pl);if(inferred&&inferred!==h){notify('账号与主页链接不一致，请核对。');return}const name=f.get('name').trim(),owner=f.get('owner').trim();if(!name||!h||!owner){notify('请填写达人名称、账号和负责人。');return}const id=newId('D');people.push({id,name,tag:f.get('tag').trim(),region:f.get('region').trim(),owner,itea:f.get('itea').trim(),email:f.get('email').trim(),contact:f.get('contact').trim(),notes:''});accounts.push({id:newId('A'),person:id,platform:pl,handle:h,url,fans:f.get('fans')===''?null:Number(f.get('fans'))});commit('新达人及平台账号已保存。')};}
 if($('collabForm'))$('collabForm').onsubmit=e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target),a=account(f.get('account'));if(!a||!project(f.get('project'))){notify('请先建立达人账号和项目。');return}if(collabs.some(c=>c.account===a.id&&c.project===f.get('project'))){notify('该达人已在此项目中登记。追加合作应在正式系统填写独立轮次。');return}collabs.push({id:newId('C'),person:a.person,account:a.id,project:f.get('project'),stage:'已报名',confirmed:'',owner:f.get('owner'),due:f.get('due'),target:Number(f.get('target'))});commit('报名已保存，可在已报名未合作视图查看。')};
 if($('postForm'))$('postForm').onsubmit=e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target),c=co(f.get('collab')),pid=f.get('platformId').trim();if(!c||!pid){notify('请选择有效合作，并填写平台Post ID。');return}const pl=account(c.account).platform;if(posts.some(p=>account(co(p.collab).account).platform===pl&&p.platformId===pid)){notify('该平台Post ID已存在，不会重复计数。');return}const p={id:newId('POST'),collab:c.id,platformId:pid,title:f.get('title').trim(),date:f.get('date'),updated:TODAY};for(const k of ['views','likes','comments','saves','shares'])p[k]=f.get(k)===''?null:Number(f.get(k));posts.push(p);commit('Post 已保存，统计已更新；完成状态仍需负责人验收。')};
 ProjectWorkflow.mount();
 globalThis.AdminUI?.mount();
}
$('project').innerHTML='<option value="">全部项目</option>'+options(projects,'id','name');
document.addEventListener('invalid',()=>notify('请填写所有必填项，并检查输入格式。'),true);
for(const id of ['query','platform','project','owner'])$(id).addEventListener(id==='query'?'input':'change',()=>{creatorPage=0;render()});
$('project').addEventListener('change',()=>{if(tab==='项目管理'){ProjectWorkflow.created($('project').value);render();}});
$('refreshButton').onclick=()=>{if(busy)return;loadData(true).then(()=>notify('已读取服务器最新资料。')).catch(e=>notify(e.message));};
$('seedButton').onclick=()=>{if(busy)return;fill(JSON.parse(JSON.stringify(seed)));commit('演示数据已载入。');$('seedButton').hidden=true;};
loadData().then(()=>{$('seedButton').hidden=backendMode==='lark'||people.length>0||projects.length>0;}).catch(e=>{notify(e.message);$('connection').textContent='连接失败';});
</script></html>
