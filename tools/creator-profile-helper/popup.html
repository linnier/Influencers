<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>itea 资料卡邮箱采集</title><link rel="stylesheet" href="popup.css"><body><header><img src="wordmark.png" alt="itea"><span>公开资料卡采集</span></header><h1>让达人发现更省事。</h1><button id="batch" class="primary">关键词自动发现 / 批量任务</button><p>输入关键词后自动扫描搜索结果与主页资料卡，无需逐个点击。</p><p>打开 Instagram / TikTok 达人主页，等待资料卡正常显示，再点击下方按钮。</p><button id="connect">连接系统并自动保存</button><button id="retry">重试待保存线索</button><p id="syncStatus" role="status">读取成功后自动保存在本机；连接系统后自动同步。</p><button id="read">读取当前主页资料卡</button><p id="status" role="status" aria-live="polite">仅手动读取当前标签页，不访问关联网站。</p><section id="result" hidden><dl><dt>达人</dt><dd id="name"></dd><dt>平台 / 账号</dt><dd id="account"></dd><dt>公开邮箱</dt><dd id="email"></dd><dt>粉丝数</dt><dd id="fans"></dd></dl><button id="copy">复制结果备份（可选）</button><details><summary>查看本次结果</summary><textarea id="json" readonly aria-label="资料卡采集结果"></textarea></details></section><footer>采集结果需核对后入库。邮箱是否可投递尚未验证。<br>本助手不发送邮件，不读取 Cookie 或密码。</footer><script src="site-sync.js"></script><script src="popup.js"></script></body></html>
