name: influencers
services:
  app:
    image: influencers-app:local
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      INFLUENCERS_DB_PATH: /app/data/influencers.sqlite
    volumes:
      - app_data:/app/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No host port: all public access goes through the authenticated proxy.
  caddy:
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure SITE_DOMAIN in .env.production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Configure ADMIN_USERNAME in .env.production}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configure ADMIN_PASSWORD_HASH in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
volumes:
  app_data:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: true
  public:
